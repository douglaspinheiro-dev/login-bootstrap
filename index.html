<!DOCTYPE html>
<html lang="pt-br">
<head>

</head>
<body>
    <main class="container-fluid">
        <div>
            <h1 class="text-center">Logo do site</h1>
            <form action="#" method= "post">

                </div>

                <div class="row">
                    <div class="col-12 d-grid botoes">

                    </div>
                    <a href="./twa.html" class="btn-link justify-content-end" >Esqueci a senha</a>
